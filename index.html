<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elemental Garden 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;600;700&display=swap">
<style>
[hidden] { display: none !important; }
body { margin: 0; }
/* Layout: full-bleed 3D garden with a floating title card and a control bar along the bottom edge */
:root {
  --bg: #cfe3ee;
  --panel: rgba(250, 252, 246, 0.92);
  --panel-solid: #fafcf6;
  --fg: #1d2b20;
  --muted: #56645a;
  --accent: #2f5d43;
  --accent-fg: #f4f7f0;
  --line: rgba(29, 43, 32, 0.14);
  --font-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Figtree', 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101a22;
    --panel: rgba(22, 31, 26, 0.9);
    --panel-solid: #16201b;
    --fg: #e8efe6;
    --muted: #a3b2a6;
    --accent: #8cc79f;
    --accent-fg: #0f1a13;
    --line: rgba(232, 239, 230, 0.16);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101a22;
  --panel: rgba(22, 31, 26, 0.9);
  --panel-solid: #16201b;
  --fg: #e8efe6;
  --muted: #a3b2a6;
  --accent: #8cc79f;
  --accent-fg: #0f1a13;
  --line: rgba(232, 239, 230, 0.16);
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#stage { position: fixed; inset: 0; touch-action: none; }
#stage canvas { display: block; width: 100%; height: 100%; }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.tag {
  position: absolute; left: 0; top: 0;
  padding: 5px 11px; border-radius: 999px;
  background: var(--panel-solid); color: var(--fg);
  font-size: 13px; font-weight: 700; white-space: nowrap;
  box-shadow: 0 2px 8px rgba(0,0,0,0.22);
  will-change: transform;
}
.tag small { font-weight: 600; color: var(--muted); }
#labels.off { display: none; }

.card {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 16px);
  left: max(16px, env(safe-area-inset-left, 0px));
  max-width: min(360px, calc(100vw - 32px));
  background: var(--panel); backdrop-filter: blur(8px);
  border: 1px solid var(--line); border-radius: 14px;
  padding: 16px 18px;
  display: flex; flex-direction: column; gap: 4px;
}
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 0; font-family: var(--font-display); font-size: clamp(24px, 4vw, 32px); line-height: 1.05; text-wrap: balance; }
.sub { font-size: 14px; color: var(--muted); }

.bar {
  position: fixed;
  left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  width: max-content; max-width: calc(100vw - 32px);
  background: var(--panel); backdrop-filter: blur(8px);
  border: 1px solid var(--line); border-radius: 14px;
  padding: 8px;
  display: flex; flex-direction: column; gap: 6px; align-items: center;
}
.buttons { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.bar button {
  font: 600 14px var(--font-body);
  color: var(--fg); background: transparent;
  border: 1px solid var(--line); border-radius: 9px;
  padding: 9px 14px; min-height: 40px; cursor: pointer;
}
.bar button:hover { border-color: var(--accent); }
.bar button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.bar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hint { font-size: 12px; color: var(--muted); text-align: center; padding: 0 6px 2px; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; font-weight: 600; color: var(--muted); }
</style>
</head>
<body>

<div id="stage" aria-label="Interactive 3D model of the Elemental Garden"></div>
<div id="labels"></div>
<div id="loading">Building the garden…</div>

<div class="card">
  <div class="eyebrow">Garden design concept · 3D</div>
  <h1>Elemental Garden</h1>
  <div class="sub">Earth · Water · Fire. Prepared for [CLIENT NAME]</div>
</div>

<div class="bar">
  <div class="buttons">
    <button id="btn-reset" type="button">Reset view</button>
    <button id="btn-top" type="button">Top view</button>
    <button id="btn-fire" type="button">Fire pit</button>
    <button id="btn-dusk" type="button" aria-pressed="false">Evening</button>
    <button id="btn-spin" type="button" aria-pressed="false">Auto-rotate</button>
    <button id="btn-labels" type="button" aria-pressed="true">Labels</button>
  </div>
  <div class="hint">Drag to rotate · scroll or pinch to zoom · right-drag or two fingers to pan</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const stage = document.getElementById('stage');
  const W = () => window.innerWidth, H = () => window.innerHeight;

  // Plan pixels (1100 x 1520 site plan) to world units: 10 px = 1 unit
  const V = (px, py, y = 0) => new THREE.Vector3((px - 550) / 10, y, (py - 760) / 10);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(W(), H());
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const DAY_SKY = new THREE.Color('#bfdcec'), DUSK_SKY = new THREE.Color('#1b2340');
  scene.background = DAY_SKY.clone();
  scene.fog = new THREE.Fog(DAY_SKY.clone(), 220, 420);

  const camera = new THREE.PerspectiveCamera(42, W() / H(), 0.5, 1000);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.maxPolarAngle = 1.45;
  controls.minDistance = 18;
  controls.maxDistance = 280;
  controls.autoRotateSpeed = 0.6;

  const views = {
    home: { pos: new THREE.Vector3(78, 92, 128), target: new THREE.Vector3(-4, 0, 2) },
    top: { pos: new THREE.Vector3(0, 215, 1), target: new THREE.Vector3(0, 0, 0) },
    fire: { pos: new THREE.Vector3(8, 22, 66), target: new THREE.Vector3(-22, 1, 37) }
  };
  let fly = null;
  function setView(v, instant) {
    if (instant || reduceMotion) { camera.position.copy(v.pos); controls.target.copy(v.target); controls.update(); return; }
    fly = { fromP: camera.position.clone(), fromT: controls.target.clone(), to: v, t: 0 };
  }
  setView(views.home, true);

  // Lights
  const hemi = new THREE.HemisphereLight(0xe4f3ff, 0x4d6b2c, 0.75);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff1d6, 1.25);
  sun.position.set(-55, 90, -40);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  const sc = sun.shadow.camera; sc.left = -95; sc.right = 95; sc.top = 95; sc.bottom = -95; sc.near = 10; sc.far = 260;
  sun.shadow.bias = -0.0006;
  scene.add(sun);

  // Procedural textures
  function canvasTex(size, draw, rx, ry) {
    const c = document.createElement('canvas'); c.width = c.height = size;
    draw(c.getContext('2d'), size);
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
    t.encoding = THREE.sRGBEncoding; t.anisotropy = 8;
    return t;
  }
  function speckle(base, cols, n, smin, smax) {
    return (g, s) => {
      g.fillStyle = base; g.fillRect(0, 0, s, s);
      for (let i = 0; i < n; i++) {
        g.fillStyle = cols[i % cols.length];
        const z = smin + Math.random() * (smax - smin);
        g.fillRect(Math.random() * s, Math.random() * s, z, z * (1 + Math.random()));
      }
    };
  }
  const grassTex = canvasTex(256, speckle('#86ad57', ['#7aa04c', '#93bb63', '#6f9644', '#a0c56f', '#81a952'], 5000, 1, 3), 30, 36);
  const gravelTex = canvasTex(128, speckle('#cdbd97', ['#b8a67e', '#ddd0b0', '#a8956d', '#e6dcc4'], 1600, 1, 2.5), 1, 1);
  const pavingTex = canvasTex(128, (g, s) => {
    g.fillStyle = '#d6ccb8'; g.fillRect(0, 0, s, s);
    g.fillStyle = '#cec2ab'; g.fillRect(64, 0, 64, 64); g.fillStyle = '#ddd4c2'; g.fillRect(0, 64, 64, 64);
    g.strokeStyle = '#a99d86'; g.lineWidth = 3;
    g.beginPath(); g.moveTo(0, 1); g.lineTo(s, 1); g.moveTo(0, 64); g.lineTo(s, 64); g.moveTo(1, 0); g.lineTo(1, 64); g.moveTo(64, 0); g.lineTo(64, 64); g.moveTo(32, 64); g.lineTo(32, s); g.moveTo(96, 64); g.lineTo(96, s); g.stroke();
  }, 10, 1);
  const brickTex = canvasTex(64, (g, s) => {
    g.fillStyle = '#b5523b'; g.fillRect(0, 0, s, s); g.strokeStyle = '#87402c'; g.lineWidth = 2;
    for (let y = 0; y <= s; y += 16) { g.beginPath(); g.moveTo(0, y); g.lineTo(s, y); g.stroke(); }
    for (let r = 0; r < 4; r++) for (let x = (r % 2) * 16; x < s; x += 32) { g.beginPath(); g.moveTo(x, r * 16); g.lineTo(x, r * 16 + 16); g.stroke(); }
  }, 2, 1);
  const thatchTex = canvasTex(128, (g, s) => {
    g.fillStyle = '#c99f48'; g.fillRect(0, 0, s, s);
    for (let i = 0; i < 900; i++) {
      g.strokeStyle = ['#b38a3c', '#dcb766', '#a17a30', '#e2c27a'][i % 4]; g.lineWidth = 1;
      const x = Math.random() * s, y = Math.random() * s; g.beginPath(); g.moveTo(x, y); g.lineTo(x + (Math.random() - 0.5) * 3, y + 8 + Math.random() * 10); g.stroke();
    }
  }, 4, 3);
  const plankTex = canvasTex(128, (g, s) => {
    g.fillStyle = '#8a6440'; g.fillRect(0, 0, s, s); g.strokeStyle = '#6a4a2c'; g.lineWidth = 2;
    for (let x = 0; x < s; x += 16) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, s); g.stroke(); }
    g.globalAlpha = 0.15; for (let i = 0; i < 300; i++) { g.fillStyle = i % 2 ? '#3e2a17' : '#b48a5c'; g.fillRect(Math.random() * s, Math.random() * s, 1, 6); }
  }, 6, 1);
  const waterTex = canvasTex(256, (g, s) => {
    g.fillStyle = '#3d8fb7'; g.fillRect(0, 0, s, s);
    for (let i = 0; i < 140; i++) { g.fillStyle = 'rgba(210,240,255,' + (0.08 + Math.random() * 0.18) + ')'; g.fillRect(Math.random() * s, Math.random() * s, 10 + Math.random() * 40, 1.5); }
  }, 4, 1);

  const M = (opts) => new THREE.MeshStandardMaterial(Object.assign({ roughness: 0.9, metalness: 0 }, opts));
  const mats = {
    grass: M({ map: grassTex }),
    gravel: M({ map: gravelTex, roughness: 1 }),
    edging: M({ color: '#8f7d5c' }),
    stone: M({ color: '#d9d1bf', roughness: 0.85 }),
    paving: M({ map: pavingTex }),
    wall: M({ color: '#efe9de' }),
    roof: M({ color: '#55595d', roughness: 0.7, side: THREE.DoubleSide, flatShading: true }),
    glass: M({ color: '#2f3d48', roughness: 0.2, metalness: 0.3 }),
    door: M({ color: '#5a3b24' }),
    brick: M({ map: brickTex }),
    grill: M({ color: '#2b2b2b', roughness: 0.5, metalness: 0.6 }),
    timber: M({ color: '#7a5536' }),
    soil: M({ color: '#4b3423', roughness: 1 }),
    plank: M({ map: plankTex }),
    turf: M({ color: '#6f9a40', flatShading: true }),
    thatch: M({ map: thatchTex, roughness: 1 }),
    coping: M({ color: '#ddd4c2', roughness: 0.8 }),
    firebed: M({ color: '#3a2a24', emissive: '#c2401a', emissiveIntensity: 0.6 }),
    charred: M({ color: '#3d2414' }),
    wood: M({ color: '#a47447' }),
    bark: M({ color: '#8a6a48' }),
    trunk: M({ color: '#6b4a30' }),
    bed: M({ color: '#557f37' }),
    bank: M({ color: '#7d6a4a', roughness: 1 })
  };
  const add = (geo, mat, x, y, z, parent) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); (parent || scene).add(m); return m; };

  // Ground
  const ground = add(new THREE.PlaneGeometry(200, 220), mats.grass, 0, 0, 0);
  ground.rotation.x = -Math.PI / 2; ground.userData.noCast = true;

  // House with hipped slate roof
  add(new THREE.BoxGeometry(70, 6, 13), mats.wall, -5, 3, -66.5);
  (function roof() {
    const x0 = -40.8, x1 = 30.8, z0 = -73.8, z1 = -59.2, y = 6, ry = 10.6, rx0 = -33.5, rx1 = 23.5, zc = -66.5;
    const v = [
      x0, y, z1, x1, y, z1, rx1, ry, zc, x0, y, z1, rx1, ry, zc, rx0, ry, zc,
      x1, y, z0, x0, y, z0, rx0, ry, zc, x1, y, z0, rx0, ry, zc, rx1, ry, zc,
      x0, y, z0, x0, y, z1, rx0, ry, zc,
      x1, y, z1, x1, y, z0, rx1, ry, zc
    ];
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3)); g.computeVertexNormals();
    add(g, mats.roof, 0, 0, 0);
    add(new THREE.BoxGeometry(1.6, 4, 1.6), M({ color: '#8a4532' }), -36, 9, -70.5);
    add(new THREE.BoxGeometry(1.6, 4, 1.6), M({ color: '#8a4532' }), 26, 9, -70.5);
  })();
  [-34, -26, -18, 8, 16, 24].forEach((x) => add(new THREE.BoxGeometry(3.2, 2.4, 0.2), mats.glass, x, 3.6, -59.95));
  add(new THREE.BoxGeometry(4.4, 4.6, 0.2), mats.glass, -5, 2.3, -59.95);
  add(new THREE.BoxGeometry(0.15, 4.6, 0.25), mats.door, -5, 2.3, -59.9);

  // Patio
  add(new THREE.BoxGeometry(76, 0.2, 7), mats.paving, -6, 0.1, -55.7);

  // Brick BBQ
  add(new THREE.BoxGeometry(6, 1.9, 9), mats.brick, -48, 0.95, -52.5);
  add(new THREE.BoxGeometry(4.6, 0.25, 4), mats.grill, -48, 2.0, -55);
  add(new THREE.BoxGeometry(4.6, 0.2, 2.6), M({ color: '#a9a59c' }), -48, 1.98, -50.2);
  add(new THREE.BoxGeometry(4.8, 1.6, 0.25), mats.grill, -48, 2.8, -57);

  // Raised beds
  const plantCols = ['#5c8d36', '#a07cc8', '#6b9a45', '#efc24f', '#4f7d30', '#e27a93'];
  function raisedBed(cx, cz, w, d) {
    add(new THREE.BoxGeometry(w, 0.9, d), mats.timber, cx, 0.45, cz);
    add(new THREE.BoxGeometry(w - 1, 0.1, d - 1), mats.soil, cx, 0.92, cz);
    const n = Math.round(w / 3.4);
    for (let i = 0; i < n; i++) {
      const col = plantCols[i % plantCols.length];
      const r = col === '#5c8d36' || col === '#6b9a45' || col === '#4f7d30' ? 1.35 : 1.0;
      const m = add(new THREE.IcosahedronGeometry(r, 1), M({ color: col, flatShading: true }), cx - w / 2 + 1.8 + i * ((w - 3.6) / (n - 1)), 1.2, cz + (i % 2 ? 0.6 : -0.6));
      m.scale.y = 0.8;
    }
  }
  raisedBed(-29, -44.25, 30, 5.5);
  raisedBed(13.5, -48, 31, 6);

  // Winding path: gravel ribbon with stepping stones
  const curve = new THREE.CurvePath();
  curve.add(new THREE.LineCurve3(V(475, 240), V(475, 520)));
  curve.add(new THREE.CubicBezierCurve3(V(475, 520), V(475, 640), V(760, 720), V(760, 880)));
  curve.add(new THREE.CubicBezierCurve3(V(760, 880), V(760, 1020), V(620, 1120), V(440, 1150)));
  function ribbon(half, y, mat, n) {
    const pts = curve.getSpacedPoints(n), pos = [], uv = [], idx = [];
    let dist = 0;
    for (let i = 0; i <= n; i++) {
      const p = pts[i], q = pts[Math.min(i + 1, n)], o = pts[Math.max(i - 1, 0)];
      const tx = q.x - o.x, tz = q.z - o.z, l = Math.hypot(tx, tz) || 1;
      const nx = -tz / l, nz = tx / l;
      if (i > 0) dist += p.distanceTo(pts[i - 1]);
      pos.push(p.x + nx * half, y, p.z + nz * half, p.x - nx * half, y, p.z - nz * half);
      uv.push(0, dist / 8, 1.25, dist / 8);
      if (i < n) { const a = i * 2; idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    g.setIndex(idx); g.computeVertexNormals();
    const m = add(g, mat, 0, 0, 0); m.userData.noCast = true; return m;
  }
  ribbon(5.7, 0.04, mats.edging, 240);
  ribbon(5.1, 0.07, mats.gravel, 240);
  (function stones() {
    const len = curve.getLength(), step = 5.4;
    for (let d = 2.5; d < len - 2; d += step) {
      const u = d / len, p = curve.getPointAt(u), t = curve.getTangentAt(u);
      const s = add(new THREE.BoxGeometry(6, 0.28, 3.3), mats.stone, p.x, 0.16, p.z);
      s.rotation.y = Math.atan2(t.x, t.z) + (Math.random() - 0.5) * 0.12;
    }
  })();

  // EARTH: round changing area with a living turf roof
  const earth = new THREE.Vector3(-26.5, 0, -23);
  add(new THREE.CylinderGeometry(8.8, 8.8, 3.2, 40), mats.plank, earth.x, 1.6, earth.z);
  add(new THREE.CylinderGeometry(9.9, 9.9, 0.3, 40), mats.timber, earth.x, 3.3, earth.z);
  add(new THREE.ConeGeometry(9.8, 3.4, 40, 3), mats.turf, earth.x, 5.15, earth.z);
  add(new THREE.BoxGeometry(0.3, 2.7, 2.2), mats.door, earth.x + 8.8, 1.35, earth.z);
  for (let i = 0; i < 14; i++) {
    const a = Math.random() * Math.PI * 2, r = 2 + Math.random() * 6.5, h = 6.8 - (r / 9.8) * 3.4;
    add(new THREE.SphereGeometry(0.35, 8, 6), M({ color: i % 2 ? '#c9a3cf' : '#e6d36a' }), earth.x + Math.cos(a) * r, h - 0.1, earth.z + Math.sin(a) * r);
  }

  // WATER: round therapy pool with stone coping and animated ripples
  const pool = new THREE.Vector3(15, 0, -24);
  add(new THREE.CylinderGeometry(11.7, 11.9, 0.8, 64), mats.coping, pool.x, 0.4, pool.z);
  const poolGeo = new THREE.RingGeometry(0.01, 10.4, 64, 12); poolGeo.rotateX(-Math.PI / 2);
  const poolBase = poolGeo.attributes.position.array.slice();
  const poolMat = M({ color: '#3fa6cb', roughness: 0.08, metalness: 0.15, emissive: '#0d4f6b', emissiveIntensity: 0.35, transparent: true, opacity: 0.93 });
  const poolMesh = add(poolGeo, poolMat, pool.x, 0.86, pool.z); poolMesh.userData.noCast = true;
  add(new THREE.CylinderGeometry(10.4, 10.4, 0.2, 64), M({ color: '#1d6b94' }), pool.x, 0.75, pool.z).userData.noCast = true;

  // Thatched shed
  add(new THREE.BoxGeometry(14, 2.8, 16), mats.plank, -44, 1.4, -3);
  (function shedRoof() {
    const s = new THREE.Shape(); s.moveTo(-8.6, 0); s.lineTo(8.6, 0); s.lineTo(0, 4.4); s.lineTo(-8.6, 0);
    const g = new THREE.ExtrudeGeometry(s, { depth: 18.4, bevelEnabled: false });
    add(g, mats.thatch, -44, 2.8, -12.2);
    add(new THREE.BoxGeometry(1.2, 0.6, 18.8), M({ color: '#8a6526' }), -44, 7.15, -3);
  })();
  add(new THREE.BoxGeometry(0.2, 2.3, 2.2), mats.door, -36.95, 1.15, 0);

  // Rockery
  [[950, 620, 3.6], [1000, 662, 2.9], [935, 692, 3.3], [992, 738, 3.5], [930, 772, 2.9], [986, 812, 3.1], [935, 852, 3.5], [992, 892, 2.9], [946, 932, 3.1]].forEach(([px, py, r], i) => {
    const p = V(px, py);
    const rock = add(new THREE.DodecahedronGeometry(r, 0), M({ color: ['#a39f95', '#b6b2a8', '#8f8b82'][i % 3], flatShading: true }), p.x, r * 0.35, p.z);
    rock.scale.set(1, 0.62, 0.85); rock.rotation.set(Math.random(), Math.random() * 3, Math.random() * 0.4);
  });
  [[968, 700, '#86b25c'], [962, 742, '#e27a93'], [958, 808, '#a07cc8'], [965, 870, '#86b25c'], [968, 905, '#efc24f'], [972, 640, '#efc24f']].forEach(([px, py, c]) => {
    const p = V(px, py); add(new THREE.IcosahedronGeometry(0.9, 1), M({ color: c, flatShading: true }), p.x, 1.6, p.z);
  });

  // FIRE: fire pit, stone ring, log seats, flames and firelight
  const fire = new THREE.Vector3(-22, 0, 39);
  const gravelDisk = add(new THREE.CircleGeometry(14.2, 64), M({ color: '#d2c4a4', roughness: 1 }), fire.x, 0.05, fire.z);
  gravelDisk.rotation.x = -Math.PI / 2; gravelDisk.userData.noCast = true;
  for (let i = 0; i < 26; i++) {
    const a = (i / 26) * Math.PI * 2;
    const b = add(new THREE.BoxGeometry(2.1, 1.1, 1.5), M({ color: i % 2 ? '#8f897f' : '#a29b90', flatShading: true }), fire.x + Math.cos(a) * 9.2, 0.55, fire.z + Math.sin(a) * 9.2);
    b.rotation.y = -a + Math.PI / 2;
  }
  const bedDisk = add(new THREE.CircleGeometry(8.4, 48), mats.firebed, fire.x, 0.25, fire.z);
  bedDisk.rotation.x = -Math.PI / 2; bedDisk.userData.noCast = true;
  [0.5, -0.6, 1.6].forEach((rot, i) => {
    const l = add(new THREE.CylinderGeometry(0.55, 0.6, 7, 10), mats.charred, fire.x, 0.75 + i * 0.25, fire.z);
    l.rotation.z = Math.PI / 2; l.rotation.y = rot;
  });
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    if (i === 0) continue;
    add(new THREE.CylinderGeometry(1.7, 1.8, 1.7, 18), mats.wood, fire.x + Math.cos(a) * 12.4, 0.85, fire.z + Math.sin(a) * 12.4);
    const top = add(new THREE.CircleGeometry(1.1, 18), M({ color: '#d4a674' }), fire.x + Math.cos(a) * 12.4, 1.72, fire.z + Math.sin(a) * 12.4);
    top.rotation.x = -Math.PI / 2;
  }
  const flames = [];
  const flameCols = ['#ffd56a', '#ff9a3c', '#ff7a2a', '#ffc14d', '#ff8c33'];
  for (let i = 0; i < 7; i++) {
    const m = new THREE.MeshBasicMaterial({ color: flameCols[i % 5], transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false });
    const a = (i / 7) * Math.PI * 2, r = i === 0 ? 0 : 1.6;
    const f = add(new THREE.ConeGeometry(i === 0 ? 1.4 : 0.9, i === 0 ? 4.6 : 3.2, 10), m, fire.x + Math.cos(a) * r, 2.6, fire.z + Math.sin(a) * r);
    f.userData.noCast = true; f.userData.phase = Math.random() * 6; f.userData.h = i === 0 ? 4.6 : 3.2;
    flames.push(f);
  }
  const fireLight = new THREE.PointLight(0xff8a3c, 1.6, 45, 2);
  fireLight.position.set(fire.x, 4, fire.z);
  scene.add(fireLight);

  // Flower planting around the seating (sector from -60 deg round to 130 deg)
  const sector = add(new THREE.RingGeometry(16, 30, 64, 3, THREE.MathUtils.degToRad(60), THREE.MathUtils.degToRad(170)), mats.bed, fire.x, 0.08, fire.z);
  sector.rotation.x = -Math.PI / 2; sector.userData.noCast = true;
  (function flowers() {
    const toXZ = (r, deg) => { const a = THREE.MathUtils.degToRad(deg); return [fire.x + Math.cos(a) * r, fire.z + Math.sin(a) * r]; };
    const bloom = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(0.55, 0), M({ flatShading: true }), 650);
    const leaf = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 1), M({ flatShading: true }), 120);
    const dummy = new THREE.Object3D(), col = new THREE.Color();
    const bCols = ['#e27a93', '#f0c454', '#a77cc9', '#f6efe0', '#e8738f', '#ff9c6b'], lCols = ['#6b9a45', '#86b25c', '#4f7d30', '#77a650'];
    for (let i = 0; i < 650; i++) {
      const [x, z] = toXZ(16.8 + Math.random() * 12.4, -60 - Math.random() * 170);
      dummy.position.set(x, 0.55 + Math.random() * 0.5, z); dummy.rotation.set(Math.random(), Math.random(), 0);
      const s = 0.7 + Math.random() * 0.6; dummy.scale.set(s, s, s); dummy.updateMatrix();
      bloom.setMatrixAt(i, dummy.matrix); bloom.setColorAt(i, col.set(bCols[i % bCols.length]));
    }
    for (let i = 0; i < 120; i++) {
      const [x, z] = toXZ(17.5 + Math.random() * 11, -62 - Math.random() * 166);
      const s = 1.2 + Math.random() * 1.1;
      dummy.position.set(x, s * 0.45, z); dummy.scale.set(s, s * 0.75, s); dummy.updateMatrix();
      leaf.setMatrixAt(i, dummy.matrix); leaf.setColorAt(i, col.set(lCols[i % lCols.length]));
    }
    scene.add(leaf); scene.add(bloom);
    [-75, -100, -125, -150, -175, -200, -220].forEach((deg) => {
      const [x, z] = toXZ(23, deg);
      const b = add(new THREE.BoxGeometry(13.6, 0.14, 0.8), mats.bark, x, 0.12, z);
      b.rotation.y = -THREE.MathUtils.degToRad(deg); b.userData.noCast = true;
    });
  })();

  // Stream along the bottom edge
  let streamWater = null;
  (function stream() {
    const top = new THREE.CurvePath();
    top.add(new THREE.CubicBezierCurve(new THREE.Vector2(0, 1440), new THREE.Vector2(200, 1415), new THREE.Vector2(400, 1470), new THREE.Vector2(600, 1445)));
    top.add(new THREE.CubicBezierCurve(new THREE.Vector2(600, 1445), new THREE.Vector2(800, 1420), new THREE.Vector2(900, 1420), new THREE.Vector2(1100, 1450)));
    const pts = top.getSpacedPoints(60).map((p) => new THREE.Vector2((p.x - 550) / 10, (p.y - 760) / 10));
    function strip(offset, bottom, mat, y) {
      const s = new THREE.Shape();
      s.moveTo(-100, -(pts[0].y + offset));
      pts.forEach((p) => s.lineTo(p.x, -(p.y + offset)));
      s.lineTo(100, -(pts[pts.length - 1].y + offset)); s.lineTo(100, -bottom); s.lineTo(-100, -bottom);
      const g = new THREE.ShapeGeometry(s); g.rotateX(-Math.PI / 2);
      const m = add(g, mat, 0, y, 0); m.userData.noCast = true; return m;
    }
    strip(-1.2, 85, mats.bank, 0.03);
    const water = strip(0, 84, M({ map: waterTex, roughness: 0.15, metalness: 0.1, emissive: '#0b3a52', emissiveIntensity: 0.3 }), 0.06);
    water.material.map.repeat.set(0.05, 0.05);
    streamWater = water;
    const farBank = add(new THREE.PlaneGeometry(200, 14), mats.grass, 0, 0.09, 91); farBank.rotation.x = -Math.PI / 2; farBank.userData.noCast = true;
    [[80, 1438], [380, 1456], [640, 1446], [1040, 1444], [220, 1430]].forEach(([px, py]) => {
      const p = V(px, py);
      for (let i = 0; i < 7; i++) {
        const h = 2 + Math.random() * 1.8;
        const r = add(new THREE.CylinderGeometry(0.06, 0.12, h, 5), M({ color: '#4f7a2f' }), p.x + (Math.random() - 0.5) * 2.4, h / 2, p.z + (Math.random() - 0.5) * 1.6);
        r.rotation.z = (Math.random() - 0.5) * 0.4;
      }
    });
    [[260, 1480, 2], [300, 1494, 1.3], [760, 1472, 1.8]].forEach(([px, py, r]) => {
      const p = V(px, py); const s = add(new THREE.DodecahedronGeometry(r, 0), M({ color: '#9b978d', flatShading: true }), p.x, 0.2, p.z); s.scale.y = 0.4;
    });
  })();

  // Trees and shrubs
  const leafCols = ['#4f7d30', '#5f8f3a', '#6b9a45', '#3f6a27'];
  function tree(x, z, r) {
    const th = r * 0.85;
    add(new THREE.CylinderGeometry(r * 0.07, r * 0.1, th, 8), mats.trunk, x, th / 2, z);
    const blobs = [[0, 0, 0, 0.75], [0.45, -0.15, 0.2, 0.55], [-0.4, -0.1, -0.25, 0.55], [0.1, 0.3, -0.35, 0.5], [-0.2, 0.25, 0.4, 0.5], [0, 0.45, 0, 0.45]];
    blobs.forEach(([dx, dy, dz, s], i) => {
      add(new THREE.IcosahedronGeometry(r * s, 1), M({ color: leafCols[i % 4], flatShading: true }), x + dx * r, th + r * 0.45 + dy * r, z + dz * r);
    });
  }
  tree(43, -63, 8.5); tree(-48, -67.5, 6); tree(-49, -28, 5.2); tree(45, 53, 8); tree(17.5, 56, 5);
  [[29.5, -34, 2.8], [31.2, -14.8, 2.4], [33, 25, 3], [1, 10, 2.4], [-13, 0, 2.2]].forEach(([x, z, r], i) => {
    const s = add(new THREE.IcosahedronGeometry(r, 1), M({ color: leafCols[(i + 1) % 4], flatShading: true }), x, r * 0.55, z); s.scale.y = 0.8;
  });

  scene.traverse((o) => { if (o.isMesh) { o.castShadow = !o.userData.noCast; o.receiveShadow = true; } });

  // Floating labels
  const labelDefs = [
    ['House', '', -5, 13, -66.5],
    ['BBQ Area', '', -48, 4.5, -52.5],
    ['Earth', 'Changing area', -26.5, 9, -23],
    ['Water', 'Therapy pool', 15, 3.5, -24],
    ['Thatched Shed', '', -44, 9, -3],
    ['Garden Path', '', 6.7, 1.5, -7.5],
    ['Rockery', '', 41.5, 5, 0],
    ['Fire', 'Fire pit & seating', -22, 7, 39],
    ['Flower Planting', '', -45, 3, 39],
    ['Stream', '', 30, 2, 73]
  ];
  const labelLayer = document.getElementById('labels');
  const labels = labelDefs.map(([name, sub, x, y, z]) => {
    const el = document.createElement('div'); el.className = 'tag';
    el.textContent = name;
    if (sub) { const s = document.createElement('small'); s.textContent = ' · ' + sub; el.appendChild(s); }
    labelLayer.appendChild(el);
    return { el, pos: new THREE.Vector3(x, y, z) };
  });
  const tmp = new THREE.Vector3();
  function placeLabels() {
    const w = W(), h = H();
    labels.forEach((l) => {
      tmp.copy(l.pos).project(camera);
      if (tmp.z > 1 || tmp.z < -1) { l.el.style.visibility = 'hidden'; return; }
      l.el.style.visibility = 'visible';
      l.el.style.transform = 'translate(' + ((tmp.x * 0.5 + 0.5) * w) + 'px,' + ((-tmp.y * 0.5 + 0.5) * h) + 'px) translate(-50%, -100%)';
    });
  }

  // Controls
  const btnDusk = document.getElementById('btn-dusk'), btnSpin = document.getElementById('btn-spin'), btnLabels = document.getElementById('btn-labels');
  document.getElementById('btn-reset').addEventListener('click', () => setView(views.home));
  document.getElementById('btn-top').addEventListener('click', () => setView(views.top));
  document.getElementById('btn-fire').addEventListener('click', () => setView(views.fire));
  let dusk = false;
  function applyLighting() {
    const sky = dusk ? DUSK_SKY : DAY_SKY;
    scene.background.copy(sky); scene.fog.color.copy(sky);
    hemi.intensity = dusk ? 0.22 : 0.75;
    sun.intensity = dusk ? 0.18 : 1.25;
    sun.color.set(dusk ? '#8fa6ff' : '#fff1d6');
    poolMat.emissive.set(dusk ? '#1aa6d8' : '#0d4f6b');
    poolMat.emissiveIntensity = dusk ? 0.9 : 0.35;
    mats.firebed.emissiveIntensity = dusk ? 1.2 : 0.6;
    btnDusk.setAttribute('aria-pressed', String(dusk));
  }
  btnDusk.addEventListener('click', () => { dusk = !dusk; applyLighting(); });
  btnSpin.addEventListener('click', () => { controls.autoRotate = !controls.autoRotate; btnSpin.setAttribute('aria-pressed', String(controls.autoRotate)); });
  btnLabels.addEventListener('click', () => { const on = labelLayer.classList.toggle('off'); btnLabels.setAttribute('aria-pressed', String(!on)); });

  window.addEventListener('resize', () => {
    camera.aspect = W() / H(); camera.updateProjectionMatrix(); renderer.setSize(W(), H());
  });

  // Animation
  const clock = new THREE.Clock();
  const pPos = poolGeo.attributes.position;
  function tick() {
    const t = clock.getElapsedTime();
    if (fly) {
      fly.t = Math.min(1, fly.t + 0.022);
      const e = fly.t < 0.5 ? 2 * fly.t * fly.t : 1 - Math.pow(-2 * fly.t + 2, 2) / 2;
      camera.position.lerpVectors(fly.fromP, fly.to.pos, e);
      controls.target.lerpVectors(fly.fromT, fly.to.target, e);
      if (fly.t >= 1) fly = null;
    }
    if (!reduceMotion) {
      for (let i = 0; i < pPos.count; i++) {
        const x = poolBase[i * 3], z = poolBase[i * 3 + 2], r = Math.hypot(x, z);
        pPos.array[i * 3 + 1] = 0.06 * Math.sin(r * 1.5 - t * 2.2) * Math.min(1, r / 2);
      }
      pPos.needsUpdate = true; poolGeo.computeVertexNormals();
      if (streamWater) streamWater.material.map.offset.x = t * 0.01;
    }
    const fl = reduceMotion ? 0 : 1;
    flames.forEach((f) => {
      const k = 1 + fl * (0.18 * Math.sin(t * 9 + f.userData.phase) + 0.1 * Math.sin(t * 17 + f.userData.phase * 2));
      f.scale.set(1, k, 1); f.position.y = 0.9 + (f.userData.h * k) / 2;
      f.material.opacity = 0.7 + fl * 0.2 * Math.sin(t * 11 + f.userData.phase);
    });
    fireLight.intensity = (dusk ? 3.2 : 1.4) * (1 + fl * 0.12 * Math.sin(t * 13) + fl * 0.06 * Math.sin(t * 29));
    controls.update();
    renderer.render(scene, camera);
    placeLabels();
    requestAnimationFrame(tick);
  }
  document.getElementById('loading').hidden = true;
  applyLighting();
  tick();
})();
</script>
</body>
</html>
