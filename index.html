<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elemental Garden 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;600;700&display=swap">
<style>
[hidden] { display: none !important; }
body { margin: 0; }
/* Layout: full-bleed 3D garden with a floating title card and a control bar along the bottom edge */
:root {
  --bg: #cfe3ee;
  --panel: rgba(250, 252, 246, 0.92);
  --panel-solid: #fafcf6;
  --fg: #1d2b20;
  --muted: #56645a;
  --accent: #2f5d43;
  --accent-fg: #f4f7f0;
  --line: rgba(29, 43, 32, 0.14);
  --font-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Figtree', 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101a22;
    --panel: rgba(22, 31, 26, 0.9);
    --panel-solid: #16201b;
    --fg: #e8efe6;
    --muted: #a3b2a6;
    --accent: #8cc79f;
    --accent-fg: #0f1a13;
    --line: rgba(232, 239, 230, 0.16);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101a22;
  --panel: rgba(22, 31, 26, 0.9);
  --panel-solid: #16201b;
  --fg: #e8efe6;
  --muted: #a3b2a6;
  --accent: #8cc79f;
  --accent-fg: #0f1a13;
  --line: rgba(232, 239, 230, 0.16);
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#stage { position: fixed; inset: 0; touch-action: none; }
#stage canvas { display: block; width: 100%; height: 100%; }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.tag {
  position: absolute; left: 0; top: 0;
  padding: 5px 11px; border-radius: 999px;
  background: var(--panel-solid); color: var(--fg);
  font-size: 13px; font-weight: 700; white-space: nowrap;
  box-shadow: 0 2px 8px rgba(0,0,0,0.22);
  will-change: transform;
}
.tag small { font-weight: 600; color: var(--muted); }
#labels.off { display: none; }

.card {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 16px);
  left: max(16px, env(safe-area-inset-left, 0px));
  max-width: min(360px, calc(100vw - 32px));
  background: var(--panel); backdrop-filter: blur(8px);
  border: 1px solid var(--line); border-radius: 14px;
  padding: 16px 18px;
  display: flex; flex-direction: column; gap: 4px;
}
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 0; font-family: var(--font-display); font-size: clamp(24px, 4vw, 32px); line-height: 1.05; text-wrap: balance; }
.sub { font-size: 14px; color: var(--muted); }

.bar {
  position: fixed;
  left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  width: max-content; max-width: calc(100vw - 32px);
  background: var(--panel); backdrop-filter: blur(8px);
  border: 1px solid var(--line); border-radius: 14px;
  padding: 8px;
  display: flex; flex-direction: column; gap: 6px; align-items: center;
}
.buttons { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.bar button {
  font: 600 14px var(--font-body);
  color: var(--fg); background: transparent;
  border: 1px solid var(--line); border-radius: 9px;
  padding: 9px 14px; min-height: 40px; cursor: pointer;
}
.bar button:hover { border-color: var(--accent); }
.bar button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.bar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hint { font-size: 12px; color: var(--muted); text-align: center; padding: 0 6px 2px; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; font-weight: 600; color: var(--muted); }
</style>
</head>
<body>

<div id="stage" aria-label="Interactive 3D model of the Elemental Garden"></div>
<div id="labels"></div>
<div id="loading">Building the garden…</div>

<div class="card">
  <div class="eyebrow">Garden design concept · 3D</div>
  <h1>Elemental Garden</h1>
</div>

<div class="bar">
  <div class="buttons">
    <button id="btn-reset" type="button">Reset view</button>
    <button id="btn-top" type="button">Top view</button>
    <button id="btn-house" type="button">House view</button>
    <button id="btn-fire" type="button">Fire pit</button>
    <button id="btn-path" type="button">Walk the path</button>
    <button id="btn-bbq" type="button">BBQ area</button>
    <button id="btn-pool" type="button">Pool</button>
    <button id="btn-changing" type="button">Changing room</button>
    <button id="btn-dusk" type="button" aria-pressed="false">Evening</button>
    <button id="btn-spin" type="button" aria-pressed="false">Auto-rotate</button>
    <button id="btn-labels" type="button" aria-pressed="true">Labels</button>
  </div>
  <div class="hint">Drag to rotate · scroll or pinch to zoom · right-drag or two fingers to pan</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const stage = document.getElementById('stage');
  const W = () => window.innerWidth, H = () => window.innerHeight;

  // Plan pixels (1100 x 1520 site plan) to world units: 10 px = 1 unit
  const V = (px, py, y = 0) => new THREE.Vector3((px - 550) / 10, y, (py - 760) / 10);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(W(), H());
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const DAY_SKY = new THREE.Color('#bfdcec'), DUSK_SKY = new THREE.Color('#1b2340');
  scene.background = DAY_SKY.clone();
  scene.fog = new THREE.Fog(DAY_SKY.clone(), 260, 1300);

  const camera = new THREE.PerspectiveCamera(42, W() / H(), 0.5, 4000);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.maxPolarAngle = 1.45;
  controls.minDistance = 4;
  controls.maxDistance = 280;
  controls.autoRotateSpeed = 0.6;

  const views = {
    home: { pos: new THREE.Vector3(-72, 82, -150), target: new THREE.Vector3(2, 0, 18) },
    top: { pos: new THREE.Vector3(0, 215, 1), target: new THREE.Vector3(0, 0, 0) },
    pool: { pos: new THREE.Vector3(-4, 13, -20), target: new THREE.Vector3(-17, -0.8, -3) },
    changing: { pos: new THREE.Vector3(2, 7, -26.8), target: new THREE.Vector3(14, 4.6, -24.3) },
    bbq: { pos: new THREE.Vector3(-35, 9.5, -33), target: new THREE.Vector3(-51, 3.5, -50) },
    house: { pos: new THREE.Vector3(-3, 9, 62), target: new THREE.Vector3(-5, 13, -66) },
    fire: { pos: new THREE.Vector3(1, 8.5, 41), target: new THREE.Vector3(-25, -2.2, 38.5) }
  };
  let fly = null;
  function setView(v, instant) {
    if (instant || reduceMotion) { camera.position.copy(v.pos); controls.target.copy(v.target); controls.update(); return; }
    fly = { fromP: camera.position.clone(), fromT: controls.target.clone(), to: v, t: 0 };
  }
  setView(views.home, true);

  // Lights
  const hemi = new THREE.HemisphereLight(0xe4f3ff, 0x4d6b2c, 0.75);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff1d6, 1.25);
  sun.position.set(-55, 90, -40);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  const sc = sun.shadow.camera; sc.left = -95; sc.right = 95; sc.top = 95; sc.bottom = -95; sc.near = 10; sc.far = 260;
  sun.shadow.bias = -0.0006;
  scene.add(sun);

  // Procedural textures
  function canvasTex(size, draw, rx, ry) {
    const c = document.createElement('canvas'); c.width = c.height = size;
    draw(c.getContext('2d'), size);
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
    t.encoding = THREE.sRGBEncoding; t.anisotropy = 8;
    return t;
  }
  function speckle(base, cols, n, smin, smax) {
    return (g, s) => {
      g.fillStyle = base; g.fillRect(0, 0, s, s);
      for (let i = 0; i < n; i++) {
        g.fillStyle = cols[i % cols.length];
        const z = smin + Math.random() * (smax - smin);
        g.fillRect(Math.random() * s, Math.random() * s, z, z * (1 + Math.random()));
      }
    };
  }
  const grassTex = (function () {
    const S = 512, c = document.createElement('canvas'); c.width = c.height = S; const g = c.getContext('2d');
    g.fillStyle = '#6c9643'; g.fillRect(0, 0, S, S);
    for (let i = 0; i < 260; i++) { g.fillStyle = ['rgba(90,130,55,0.25)', 'rgba(130,165,80,0.22)', 'rgba(75,110,45,0.25)'][i % 3]; g.beginPath(); g.arc(Math.random() * S, Math.random() * S, 6 + Math.random() * 20, 0, Math.PI * 2); g.fill(); }
    const cols = ['#5e8a3a', '#7aa64e', '#88b35a', '#4f7a30', '#93bd66', '#6a9440', '#a2c675', '#577f35', '#b0b46e', '#7f9f4a'];
    for (let i = 0; i < 26000; i++) {
      const x = Math.random() * S, y = Math.random() * S, L = 4 + Math.random() * 9, a = -Math.PI / 2 + (Math.random() - 0.5) * 1.1;
      g.strokeStyle = cols[i % cols.length]; g.globalAlpha = 0.6 + Math.random() * 0.4; g.lineWidth = 0.8 + Math.random() * 0.9;
      for (const ox of [0, x < 12 ? S : x > S - 12 ? -S : 0]) for (const oy of [0, y < 12 ? S : y > S - 12 ? -S : 0]) {
        g.beginPath(); g.moveTo(x + ox, y + oy); g.lineTo(x + ox + Math.cos(a) * L, y + oy + Math.sin(a) * L); g.stroke();
      }
    }
    g.globalAlpha = 1;
    const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; t.repeat.set(30, 36);
    return t;
  })();
  const gravelTex = canvasTex(128, speckle('#cdbd97', ['#b8a67e', '#ddd0b0', '#a8956d', '#e6dcc4'], 1600, 1, 2.5), 1, 1);
  const pavingTex = canvasTex(128, (g, s) => {
    g.fillStyle = '#d6ccb8'; g.fillRect(0, 0, s, s);
    g.fillStyle = '#cec2ab'; g.fillRect(64, 0, 64, 64); g.fillStyle = '#ddd4c2'; g.fillRect(0, 64, 64, 64);
    g.strokeStyle = '#a99d86'; g.lineWidth = 3;
    g.beginPath(); g.moveTo(0, 1); g.lineTo(s, 1); g.moveTo(0, 64); g.lineTo(s, 64); g.moveTo(1, 0); g.lineTo(1, 64); g.moveTo(64, 0); g.lineTo(64, 64); g.moveTo(32, 64); g.lineTo(32, s); g.moveTo(96, 64); g.lineTo(96, s); g.stroke();
  }, 10, 1);
  const brickTex = canvasTex(64, (g, s) => {
    g.fillStyle = '#b5523b'; g.fillRect(0, 0, s, s); g.strokeStyle = '#87402c'; g.lineWidth = 2;
    for (let y = 0; y <= s; y += 16) { g.beginPath(); g.moveTo(0, y); g.lineTo(s, y); g.stroke(); }
    for (let r = 0; r < 4; r++) for (let x = (r % 2) * 16; x < s; x += 32) { g.beginPath(); g.moveTo(x, r * 16); g.lineTo(x, r * 16 + 16); g.stroke(); }
  }, 2, 1);
  const thatchTex = canvasTex(128, (g, s) => {
    g.fillStyle = '#c99f48'; g.fillRect(0, 0, s, s);
    for (let i = 0; i < 900; i++) {
      g.strokeStyle = ['#b38a3c', '#dcb766', '#a17a30', '#e2c27a'][i % 4]; g.lineWidth = 1;
      const x = Math.random() * s, y = Math.random() * s; g.beginPath(); g.moveTo(x, y); g.lineTo(x + (Math.random() - 0.5) * 3, y + 8 + Math.random() * 10); g.stroke();
    }
  }, 4, 3);
  const plankTex = canvasTex(128, (g, s) => {
    g.fillStyle = '#8a6440'; g.fillRect(0, 0, s, s); g.strokeStyle = '#6a4a2c'; g.lineWidth = 2;
    for (let x = 0; x < s; x += 16) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, s); g.stroke(); }
    g.globalAlpha = 0.15; for (let i = 0; i < 300; i++) { g.fillStyle = i % 2 ? '#3e2a17' : '#b48a5c'; g.fillRect(Math.random() * s, Math.random() * s, 1, 6); }
  }, 6, 1);
  const waterTex = canvasTex(256, (g, s) => {
    g.fillStyle = '#3d8fb7'; g.fillRect(0, 0, s, s);
    for (let i = 0; i < 140; i++) { g.fillStyle = 'rgba(210,240,255,' + (0.08 + Math.random() * 0.18) + ')'; g.fillRect(Math.random() * s, Math.random() * s, 10 + Math.random() * 40, 1.5); }
  }, 4, 1);

  const M = (opts) => new THREE.MeshStandardMaterial(Object.assign({ roughness: 0.9, metalness: 0 }, opts));
  const mats = {
    grass: M({ map: grassTex }),
    gravel: M({ map: gravelTex, roughness: 1 }),
    edging: M({ color: '#8f7d5c' }),
    stone: M({ color: '#d9d1bf', roughness: 0.85 }),
    paving: M({ map: pavingTex }),
    wall: M({ color: '#efe9de' }),
    roof: M({ color: '#55595d', roughness: 0.7, side: THREE.DoubleSide, flatShading: true }),
    glass: M({ color: '#2f3d48', roughness: 0.2, metalness: 0.3 }),
    door: M({ color: '#5a3b24' }),
    brick: M({ map: brickTex }),
    grill: M({ color: '#2b2b2b', roughness: 0.5, metalness: 0.6 }),
    timber: M({ color: '#7a5536' }),
    soil: M({ color: '#4b3423', roughness: 1 }),
    plank: M({ map: plankTex }),
    turf: M({ color: '#6f9a40', flatShading: true }),
    thatch: M({ map: thatchTex, roughness: 1 }),
    coping: M({ color: '#ddd4c2', roughness: 0.8 }),
    firebed: M({ color: '#3a2a24', emissive: '#c2401a', emissiveIntensity: 0.6 }),
    charred: M({ color: '#3d2414' }),
    wood: M({ color: '#a47447' }),
    bark: M({ color: '#8a6a48' }),
    trunk: M({ color: '#6b4a30' }),
    bed: M({ color: '#557f37' }),
    bank: M({ color: '#7d6a4a', roughness: 1 })
  };
  const add = (geo, mat, x, y, z, parent) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); (parent || scene).add(m); return m; };

  // Ground: lawn with an opening for the sunken fire pit and its front steps
  const groundTex = grassTex.clone(); groundTex.needsUpdate = true; groundTex.repeat.set(0.13, 0.15);
  const groundShape = new THREE.Shape();
  groundShape.moveTo(-350, 110); groundShape.lineTo(350, 110); groundShape.lineTo(350, -76); groundShape.lineTo(-350, -76); groundShape.lineTo(-350, 110);
  (function () {
    const fx = -22, fz = 39, h = new THREE.Path(), d2r = Math.PI / 180;
    const P = (r, a) => [fx + Math.cos(a * d2r) * r, -(fz + Math.sin(a * d2r) * r)];
    for (let a = 22; a <= 338; a += 3) { const [x, y] = P(12.32, a); a === 22 ? h.moveTo(x, y) : h.lineTo(x, y); }
    { const [x, y] = P(12.32, 338); h.lineTo(x, y); }
    for (let a = 338; a <= 382; a += 2) { const [x, y] = P(14.45, a); h.lineTo(x, y); }
    { const [x, y] = P(12.32, 22); h.lineTo(x, y); }
    groundShape.holes.push(h);
    const ph = new THREE.Path();
    for (let a = 0; a <= 360; a += 4) { const x = -17 + Math.cos(a * d2r) * 7.63, y = -(-3 + Math.sin(a * d2r) * 7.63); a ? ph.lineTo(x, y) : ph.moveTo(x, y); }
    groundShape.holes.push(ph);
  })();
  const groundGeo = new THREE.ShapeGeometry(groundShape, 24); groundGeo.rotateX(-Math.PI / 2);
  const ground = add(groundGeo, M({ map: groundTex, roughness: 0.95 }), 0, 0, 0);
  ground.userData.noCast = true;

  // House, modelled on the client's photo: red-brick ground floor, cream render above,
  // brown tiled hipped roof with two front gables, porch canopy, French doors and a Victorian conservatory
  (function house() {
    const FZ = -60; // front wall plane, facing the garden
    // realistic stretcher-bond brick: 8 bricks x 24 courses per tile, mixed reds and browns, thin pale mortar
    const realBrick = canvasTex(512, (g, s) => {
      g.fillStyle = '#b8ad9c'; g.fillRect(0, 0, s, s);
      const cols = ['#9a4a33', '#a3553b', '#8c432f', '#b0624a', '#7f3c2a', '#a85a3f', '#93503a', '#9e5844', '#874834'];
      const bw = s / 8, bh = s / 24, m = 2;
      for (let r = 0; r < 24; r++) {
        const off = r % 2 ? bw / 2 : 0;
        for (let c = -1; c < 9; c++) {
          const x = c * bw + off, y = r * bh;
          g.fillStyle = cols[Math.floor(Math.random() * cols.length)];
          g.fillRect(x + m / 2, y + m / 2, bw - m, bh - m);
          for (let k = 0; k < 40; k++) {
            g.fillStyle = Math.random() < 0.5 ? 'rgba(40,20,10,0.18)' : 'rgba(255,220,190,0.12)';
            g.fillRect(x + m + Math.random() * (bw - 2 * m), y + m + Math.random() * (bh - 2 * m), 1.5, 1.5);
          }
          const sh = g.createLinearGradient(0, y, 0, y + bh);
          sh.addColorStop(0, 'rgba(255,255,255,0.05)'); sh.addColorStop(1, 'rgba(0,0,0,0.08)');
          g.fillStyle = sh; g.fillRect(x + m / 2, y + m / 2, bw - m, bh - m);
        }
      }
    }, 1, 1);
    // concrete interlocking roof tiles, dark brown-grey like the photo
    const tileTex = canvasTex(256, (g, s) => {
      const rows = 6, rh = s / rows, cols = 4, cw = s / cols;
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
        const v = Math.floor(Math.random() * 14) - 7;
        g.fillStyle = 'rgb(' + (74 + v) + ',' + (60 + v) + ',' + (53 + v) + ')';
        g.fillRect(c * cw, r * rh, cw, rh);
        const gr = g.createLinearGradient(0, r * rh, 0, (r + 1) * rh);
        gr.addColorStop(0, 'rgba(0,0,0,0.35)'); gr.addColorStop(0.25, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(255,255,255,0.06)');
        g.fillStyle = gr; g.fillRect(c * cw, r * rh, cw, rh);
        g.fillStyle = 'rgba(0,0,0,0.25)'; g.fillRect(c * cw + (r % 2 ? cw / 2 : 0), r * rh, 1.5, rh);
        for (let k = 0; k < 60; k++) { g.fillStyle = Math.random() < 0.5 ? 'rgba(0,0,0,0.12)' : 'rgba(200,190,170,0.08)'; g.fillRect(c * cw + Math.random() * cw, r * rh + Math.random() * rh, 1.5, 1.5); }
      }
    }, 1, 1);
    const brick = M({ map: realBrick, roughness: 0.95 });
    const tile = M({ map: tileTex, roughness: 0.9, side: THREE.DoubleSide });
    const render = M({ color: '#efe6cf', roughness: 0.95 });
    const white = M({ color: '#f7f7f4', roughness: 0.5 });
    const shutter = M({ color: '#e3e4df', roughness: 0.6 });
    const BRICK = [8, 8], TILE = [4, 2.4];
    const box = (w, h, d, mat, x, y, z) => add(new THREE.BoxGeometry(w, h, d), mat, x, y, z);
    // box whose texture keeps real-world size on every face
    function texBox(w, h, d, mat, x, y, z, tile) {
      const g = new THREE.BoxGeometry(w, h, d), uv = g.attributes.uv;
      const dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
      for (let f = 0; f < 6; f++) for (let k = 0; k < 4; k++) {
        const i = f * 4 + k; uv.setXY(i, uv.getX(i) * dims[f][0] / tile[0], uv.getY(i) * dims[f][1] / tile[1]);
      }
      return add(g, mat, x, y, z);
    }
    // triangles with planar UVs: courses follow height, u runs along x or z
    function tri(pts, mat, tile) {
      const g = new THREE.BufferGeometry(), flat = pts.flat();
      g.setAttribute('position', new THREE.Float32BufferAttribute(flat, 3));
      if (tile) {
        const uv = [];
        for (let t = 0; t < pts.length; t += 3) {
          const [a, b, c] = [pts[t], pts[t + 1], pts[t + 2]].map((p) => new THREE.Vector3(...p));
          const n = new THREE.Vector3().crossVectors(b.clone().sub(a), c.clone().sub(a));
          const useX = Math.abs(n.z) >= Math.abs(n.x);
          [a, b, c].forEach((p) => uv.push((useX ? p.x : p.z) / tile[0], p.y / tile[1]));
        }
        g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
      }
      g.computeVertexNormals();
      return add(g, mat, 0, 0, 0);
    }

    // walls

      scree.setMatrixAt(si, dm.matrix); scree.setColorAt(si++, col.set(['#a39e93', '#8e897e', '#b5b0a5', '#7d786d'][k % 4]));
    }
    scree.count = si; scene.add(scree);
    // alpine cushions in flower (aubrieta, saxifrage, alyssum, thrift)
    const cushions = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 12, 6, 0, Math.PI * 2, 0, Math.PI / 2), M({ flatShading: true, roughness: 0.9 }), 60);
    const dots = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(0.07, 0), M({ roughness: 0.7 }), 4000);
    const cushionCols = [['#8e5cc7', '#4f6e35'], ['#e07aa8', '#557a38'], ['#f4f2ee', '#4c6a33'], ['#f1cf3c', '#6f8a3c'], ['#c74f8a', '#4f6e35']];
    let ci = 0, di = 0;
    for (let k = 0; k < 60; k++) {
      const p = randOnMound(0.5); if (!p) continue;
      const [fc, lc] = cushionCols[k % cushionCols.length], rx = 0.7 + Math.random() * 0.9, rz = rx * (0.7 + Math.random() * 0.6), h = 0.35 + Math.random() * 0.2;
      dm.position.set(p[0], p[1] - 0.05, p[2]); dm.scale.set(rx, h, rz); dm.rotation.set(0, Math.random() * 3, 0); dm.updateMatrix();
      cushions.setMatrixAt(ci, dm.matrix); cushions.setColorAt(ci++, col.set(lc));
      const nd = Math.round(rx * rz * 55);

        dm.position.set(p[0] + u * rx, p[1] - 0.05 + h * Math.sqrt(Math.max(0, 1 - q * q)) + 0.02, p[2] + w * rz);

    // sedum rosettes
    for (let k = 0; k < 22; k++) {
      const p = randOnMound(0.3); if (!p) continue;
      const c = k % 3 ? '#9bb37a' : '#b0644f';
      for (let j = 0; j < 5; j++) {
        const a = (j / 5) * Math.PI * 2, leaf = add(new THREE.SphereGeometry(0.16, 6, 4), M({ color: c, flatShading: true }), p[0] + Math.cos(a) * 0.17, p[1] + 0.06, p[2] + Math.sin(a) * 0.17);

    for (let k = 0; k < 30; k++) {

      const y = moundY(x, z);

      add(new THREE.ConeGeometry(0.8 * s, 2.4 * s, 9), M({ color: '#3a6430', flatShading: true }), x, y + 2.6 * s, z);
    });
  })();

  // FIRE: sunken mosaic fire pit modelled on the client's reference photo
  // floor sits 2.4 below the lawn; wavy trencadis bench all round; stone steps down at the front;
  // pebble-mosaic floor with compass star and spirals; corten fire bowl; olive pot, jasmine, lavender, alliums, lupins
  const fire = new THREE.Vector3(-22, 0, 39);
  const deg = THREE.MathUtils.degToRad;
  const FLOOR = -2.4, R_OUT = 12.3, R_STEP = 14.4, OPEN = 22;

  function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
  function texFrom(c, rx, ry) { const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t; }

  // broken-tile (trencadis) shards with dark grout, scattered rosettes and stars
  function trencadis(size, motifs, armBand) {
    const c = makeCanvas(size, size), g = c.getContext('2d');
    g.fillStyle = '#6f6c66'; g.fillRect(0, 0, size, size);
    const tones = ['#f5f4f0', '#eeede8', '#e5e3dd', '#f8f7f3', '#dbd9d2', '#e9e8e2', '#d2d8dd'];
    const n = 30, cell = size / n;
    for (let i = -1; i <= n; i++) for (let j = -1; j <= n; j++) {
      const cx = (i + 0.5) * cell + (Math.random() - 0.5) * cell * 0.3, cy = (j + 0.5) * cell + (Math.random() - 0.5) * cell * 0.3;
      const k = 4 + Math.floor(Math.random() * 3), base = Math.random() * Math.PI;
      g.beginPath();
      for (let p = 0; p < k; p++) {
        const a = base + (p / k) * Math.PI * 2 + (Math.random() - 0.5) * 0.5, r = cell * (0.4 + Math.random() * 0.14);
        const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r; p ? g.lineTo(x, y) : g.moveTo(x, y);
      }
      g.closePath();
      g.fillStyle = tones[Math.floor(Math.random() * tones.length)]; g.fill();
      const hl = g.createLinearGradient(cx - cell / 2, cy - cell / 2, cx + cell / 2, cy + cell / 2);
      hl.addColorStop(0, 'rgba(255,255,255,0.35)'); hl.addColorStop(1, 'rgba(0,0,0,0.08)');
      g.fillStyle = hl; g.fill();
    }
    const dark = '#34383e';
    function rosette(x, y, r) {
      g.fillStyle = dark; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#f2f1ec'; g.beginPath(); g.arc(x, y, r * 0.55, 0, Math.PI * 2); g.fill();
      g.fillStyle = dark; g.beginPath(); g.arc(x, y, r * 0.25, 0, Math.PI * 2); g.fill();
      for (let k = 0; k < 8; k++) { const a = (k / 8) * Math.PI * 2; g.beginPath(); g.arc(x + Math.cos(a) * r * 1.45, y + Math.sin(a) * r * 1.45, r * 0.17, 0, Math.PI * 2); g.fill(); }
    }
    function star(x, y, r, pts) {
      g.fillStyle = dark; g.beginPath();
      for (let k = 0; k < pts * 2; k++) { const a = (k / (pts * 2)) * Math.PI * 2 - Math.PI / 2, rr = k % 2 ? r * 0.38 : r; const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr; k ? g.lineTo(px, py) : g.moveTo(px, py); }
      g.closePath(); g.fill();
    }
    function flower(x, y, r) {
      g.fillStyle = '#1f2a3a';
      for (let k = 0; k < 4; k++) { const a = (k / 4) * Math.PI * 2; g.beginPath(); g.ellipse(x + Math.cos(a) * r * 0.55, y + Math.sin(a) * r * 0.55, r * 0.5, r * 0.28, a, 0, Math.PI * 2); g.fill(); }
      g.save(); g.translate(x, y); g.rotate(Math.PI / 4); g.strokeStyle = '#1f2a3a'; g.lineWidth = r * 0.12; g.strokeRect(-r * 1.05, -r * 1.05, r * 2.1, r * 2.1); g.restore();
      g.fillStyle = '#f2f1ec'; g.beginPath(); g.arc(x, y, r * 0.22, 0, Math.PI * 2); g.fill();
    }

      const m = 5, mc = size / m;
      for (let i = 0; i < m; i++) for (let j = 0; j < m; j++) {
        if (Math.random() < 0.3) continue;
        const x = (i + 0.5) * mc + (Math.random() - 0.5) * mc * 0.5, y = (j + 0.5) * mc + (Math.random() - 0.5) * mc * 0.5;
        const pick = Math.random();

        else if (pick < 0.8) star(x, y, size * 0.026, 8);

      }
    }

      for (let i = 0; i < 4; i++) flower((i + 0.5) * (size / 4), size * 0.5, size * 0.07);
      for (let i = 0; i < 8; i++) { g.fillStyle = '#1f2a3a'; g.beginPath(); g.arc((i + 0.5) * (size / 8), size * 0.27, size * 0.012, 0, Math.PI * 2); g.fill(); g.beginPath(); g.arc((i + 0.5) * (size / 8), size * 0.73, size * 0.012, 0, Math.PI * 2); g.fill(); }
    }

  }
  const benchMat = new THREE.MeshStandardMaterial({ map: texFrom(trencadis(1024, true, false), 1, 1), roughness: 0.32, metalness: 0.02, vertexColors: true, side: THREE.DoubleSide });

  const benchPlain = benchMat.clone(); benchPlain.vertexColors = false;
  const armPlain = armMat.clone(); armPlain.vertexColors = false;

  // pebble mosaic floor: draw the design, then rebuild it from thousands of pebbles set in grout
  const floorTex = (function () {
    const S = 2048, R = S / 2, C = S / 2;
    const d = makeCanvas(S, S), g = d.getContext('2d');

      const a = (i / 14) * Math.PI * 2, cx = C + Math.cos(a) * R * 0.79, cy = C + Math.sin(a) * R * 0.79;
      g.fillStyle = '#efeee9'; g.beginPath(); g.arc(cx, cy, 150, 0, Math.PI * 2); g.fill();
      g.strokeStyle = '#5e6166'; g.lineWidth = 17; g.beginPath();
      for (let th = 0; th < Math.PI * 7; th += 0.05) { const rr = 8 + th * 6.6, x = cx + Math.cos(th + a) * rr, y = cy + Math.sin(th + a) * rr; th ? g.lineTo(x, y) : g.moveTo(x, y); }

      g.strokeStyle = '#5e6166'; g.lineWidth = 12; g.beginPath(); g.arc(cx, cy, 152, 0, Math.PI * 2); g.stroke();
    }
    g.fillStyle = '#f0efea'; g.beginPath(); g.arc(C, C, R * 0.6, 0, Math.PI * 2); g.fill();
    ring(R * 0.6, 22, '#4f5257'); ring(R * 0.56, 8, '#8d9095'); ring(R * 0.25, 10, '#8d9095');
    const pts = [];
    for (let k = 0; k < 8; k++) pts.push({ a: (k / 8) * Math.PI * 2 - Math.PI / 2, L: k % 2 ? R * 0.36 : R * 0.55, w: k % 2 ? R * 0.075 : R * 0.1 });
    [...pts.filter((p, k) => k % 2), ...pts.filter((p, k) => !(k % 2))].forEach((p) => {
      const tip = [C + Math.cos(p.a) * p.L, C + Math.sin(p.a) * p.L];
      const lft = [C + Math.cos(p.a - Math.PI / 4) * p.w * 1.4, C + Math.sin(p.a - Math.PI / 4) * p.w * 1.4];
      const rgt = [C + Math.cos(p.a + Math.PI / 4) * p.w * 1.4, C + Math.sin(p.a + Math.PI / 4) * p.w * 1.4];
      g.fillStyle = '#505358'; g.beginPath(); g.moveTo(C, C); g.lineTo(...lft); g.lineTo(...tip); g.closePath(); g.fill();
      g.fillStyle = '#e4e2dc'; g.beginPath(); g.moveTo(C, C); g.lineTo(...rgt); g.lineTo(...tip); g.closePath(); g.fill();
      g.strokeStyle = '#2f3134'; g.lineWidth = 6; g.beginPath(); g.moveTo(...lft); g.lineTo(...tip); g.lineTo(...rgt); g.moveTo(C, C); g.lineTo(...tip); g.stroke();
    });
    g.fillStyle = '#3a3c40'; g.beginPath(); g.arc(C, C, 26, 0, Math.PI * 2); g.fill();
    const src = g.getImageData(0, 0, S, S).data;
    const out = makeCanvas(S, S), o = out.getContext('2d');
    o.fillStyle = '#7c7973'; o.fillRect(0, 0, S, S);
    for (let n = 0; n < 150000; n++) {
      const x = Math.random() * S, y = Math.random() * S;
      if ((x - C) * (x - C) + (y - C) * (y - C) > R * R) continue;
      const i = ((y | 0) * S + (x | 0)) * 4, v = (Math.random() - 0.5) * 26;
      o.fillStyle = 'rgb(' + Math.max(0, Math.min(255, src[i] + v)) + ',' + Math.max(0, Math.min(255, src[i + 1] + v)) + ',' + Math.max(0, Math.min(255, src[i + 2] + v)) + ')';
      o.beginPath(); o.ellipse(x, y, 4 + Math.random() * 4.5, 3 + Math.random() * 3, Math.random() * Math.PI, 0, Math.PI * 2); o.fill();
    }
    o.globalAlpha = 0.25;
    for (let n = 0; n < 9000; n++) { const x = Math.random() * S, y = Math.random() * S; o.fillStyle = '#ffffff'; o.beginPath(); o.arc(x, y, 1.6, 0, Math.PI * 2); o.fill(); }
    o.globalAlpha = 1;
    const ao = o.createRadialGradient(C, C, R * 0.86, C, C, R);
    ao.addColorStop(0, 'rgba(0,0,0,0)'); ao.addColorStop(1, 'rgba(0,0,0,0.5)');

  })();

  // weathered limestone for the steps
  const stoneTex = canvasTex(512, (g, s) => {
    g.fillStyle = '#cdc6b5'; g.fillRect(0, 0, s, s);
    for (let i = 0; i < 9000; i++) { g.fillStyle = ['#bfb7a5', '#d9d3c4', '#b3ab98', '#e2ddd0'][i % 4]; g.fillRect(Math.random() * s, Math.random() * s, 2, 2); }
    for (let i = 0; i < 26; i++) { g.fillStyle = 'rgba(96,110,62,' + (0.15 + Math.random() * 0.25) + ')'; g.beginPath(); g.ellipse(Math.random() * s, Math.random() * s, 10 + Math.random() * 30, 6 + Math.random() * 14, Math.random() * 3, 0, Math.PI * 2); g.fill(); }
    for (let i = 0; i < 8; i++) { g.strokeStyle = 'rgba(60,55,45,0.25)'; g.lineWidth = 1.2; g.beginPath(); let x = Math.random() * s, y = Math.random() * s; g.moveTo(x, y); for (let k = 0; k < 6; k++) { x += (Math.random() - 0.5) * 60; y += (Math.random() - 0.5) * 60; g.lineTo(x, y); } g.stroke(); }
  }, 0.22, 0.22);
  const stoneMat = M({ map: stoneTex, roughness: 0.95 });

  // corten steel for the bowl
  const cortenTex = canvasTex(256, (g, s) => {
    g.fillStyle = '#6f381c'; g.fillRect(0, 0, s, s);
    for (let i = 0; i < 6000; i++) { g.fillStyle = ['#8a4824', '#5a2c16', '#a0582c', '#4a2412', '#b56a3a'][i % 5]; g.globalAlpha = 0.5; g.fillRect(Math.random() * s, Math.random() * s, 2 + Math.random() * 3, 2 + Math.random() * 3); }
    g.globalAlpha = 1;
  }, 3, 1);

  // planting bed round the pit, leaving the step opening clear
  const bedOuter = add(new THREE.RingGeometry(R_STEP, 16.2, 72, 1), mats.bed, fire.x, 0.05, fire.z);
  bedOuter.rotation.x = -Math.PI / 2; bedOuter.userData.noCast = true;
  const bedInner = add(new THREE.RingGeometry(R_OUT - 0.1, R_STEP + 0.05, 64, 1, deg(OPEN), deg(360 - 2 * OPEN)), mats.bed, fire.x, 0.05, fire.z);
  bedInner.rotation.x = -Math.PI / 2; bedInner.userData.noCast = true;

  // sunken floor
  const floor = add(new THREE.CircleGeometry(9.66, 96), M({ map: floorTex, roughness: 0.85 }), fire.x, FLOOR + 0.01, fire.z);
  floor.rotation.x = -Math.PI / 2; floor.userData.noCast = true;
  // dark earth beneath, so no gaps show at the edges
  const pitBase = add(new THREE.CircleGeometry(R_STEP + 0.5, 64), M({ color: '#3b3127' }), fire.x, FLOOR - 0.05, fire.z);
  pitBase.rotation.x = -Math.PI / 2; pitBase.userData.noCast = true;

  // the wavy bench: profile swept round the pit, with baked shading in the creases
  const hb = (t) => 0.25 + 0.55 * (0.5 + 0.5 * Math.cos(7 * t + 0.4)) + 0.45 * (0.5 + 0.5 * Math.cos(3 * t + 2.6)) + 0.12 * Math.sin(13 * t);
  const prof = (t) => {
    const h = hb(t);
    return [[R_OUT, -0.15, 0.8], [R_OUT, h - 0.28, 1], [12.15, h - 0.02, 1], [11.85, h + 0.12, 1], [11.55, h, 1], [11.4, h - 0.32, 0.95],
            [11.3, -1.05, 0.78], [11.1, -1.4, 0.6], [10.0, -1.4, 0.95], [9.72, -1.5, 1], [9.6, -1.78, 0.9], [9.58, FLOOR, 0.5]];
  };
  (function bench() {
    const a0 = deg(OPEN), a1 = deg(360 - OPEN), N = 260, P = prof(0).length;
    const pos = [], uv = [], col = [], idx = [];
    for (let i = 0; i <= N; i++) {
      const t = a0 + (a1 - a0) * (i / N), c = Math.cos(t), s = Math.sin(t), pr = prof(t);
      let v = 0;
      for (let j = 0; j < P; j++) {

    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    g.setIndex(idx); g.computeVertexNormals();
    add(g, benchMat, 0, 0, 0);
  })();

  // curling arms either side of the steps, with the dark flower band along the top
  [1, -1].forEach((sgn) => {
    const ta = deg(sgn * (OPEN + 0.5)), dx = Math.cos(ta), dz = Math.sin(ta), px = -dz, pz = dx;
    const hEnd = hb(deg(sgn > 0 ? OPEN : 360 - OPEN));
    const r0 = 9.5, r1 = 15.6, N = 60;
    const sec = (yt, yb) => [[-0.72, yb, 0.55], [-0.72, yt - 0.38, 0.95], [-0.58, yt - 0.08, 1], [-0.28, yt + 0.06, 1], [0.28, yt + 0.06, 1], [0.58, yt - 0.08, 1], [0.72, yt - 0.38, 0.95], [0.72, yb, 0.55]];
    const pos = [], uv = [], col = [], idx = [];
    let S = 0;
    for (let i = 0; i <= N; i++) {
      const r = r0 + (r1 - r0) * (i / N), f = Math.min(1, Math.max(0, (r - 11) / 4.4)), e = f * f * (3 - 2 * f);
      const yt = hEnd + (0.35 - hEnd) * e - 0.25 * Math.sin(Math.PI * e) * 0.6, yb = r < R_STEP + 0.2 ? FLOOR : -0.1;
      const cs = sec(yt, yb);
      let total = 0; for (let j = 1; j < cs.length; j++) total += Math.hypot(cs[j][0] - cs[j - 1][0], cs[j][1] - cs[j - 1][1]);
      let v = 0;
      cs.forEach(([o, y, ao], j) => {
        if (j) v += Math.hypot(cs[j][0] - cs[j - 1][0], cs[j][1] - cs[j - 1][1]);
        pos.push(fire.x + dx * r + px * o, y, fire.z + dz * r + pz * o);
        uv.push((r - r0) / 1.55, v / total); col.push(ao, ao, ao);
      });
    }
    const P = 8;
    for (let i = 0; i < N; i++) for (let j = 0; j < P - 1; j++) { const a = i * P + j, b = (i + 1) * P + j; idx.push(a, b, a + 1, a + 1, b, b + 1); }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));

    scene.background.copy(sky); scene.fog.color.copy(sky);
    hemi.intensity = dusk ? 0.22 : 0.75;
    sun.intensity = dusk ? 0.18 : 1.25;
    sun.color.set(dusk ? '#8fa6ff' : '#fff1d6');
    poolMat.emissive.set(dusk ? '#1aa6d8' : '#0d4f6b');
    poolMat.emissiveIntensity = dusk ? 0.7 : 0.3;
    poolLamp.intensity = dusk ? 1.6 : 0;
    poolLightMat.emissiveIntensity = dusk ? 3 : 0.4;
    mats.firebed.emissiveIntensity = dusk ? 1.2 : 0.6;
    bulbMat.emissiveIntensity = dusk ? 3 : 0.6;
    bbqBulbMat.emissiveIntensity = dusk ? 3 : 0.6;
    upLightMat.emissiveIntensity = dusk ? 3 : 0.5;
    pathGlowMat.opacity = dusk ? 0.55 : 0.08;
    btnDusk.setAttribute('aria-pressed', String(dusk));
  }
  btnDusk.addEventListener('click', () => { dusk = !dusk; applyLighting(); });
  btnSpin.addEventListener('click', () => { controls.autoRotate = !controls.autoRotate; btnSpin.setAttribute('aria-pressed', String(controls.autoRotate)); });
  btnLabels.addEventListener('click', () => { const on = labelLayer.classList.toggle('off'); btnLabels.setAttribute('aria-pressed', String(!on)); });

  window.addEventListener('resize', () => {
    camera.aspect = W() / H(); camera.updateProjectionMatrix(); renderer.setSize(W(), H());
  });

  // Animation
  const clock = new THREE.Clock();
  const pPos = poolGeo.attributes.position;
  let lastTick = 0;
  function tick() {
    const t = clock.getElapsedTime(), dt = Math.min(0.05, Math.max(0, t - lastTick)); lastTick = t;
    if (walk) {
      walk.t = Math.min(1, walk.t + 1 / (60 * 18));
      const e = walk.t < 0.5 ? 2 * walk.t * walk.t : 1 - Math.pow(-2 * walk.t + 2, 2) / 2;
      const d = 3 + e * (pathLen - 24), a = frameAt(d), b = frameAt(d + 9);
      camera.position.set(a.p.x, 3.4, a.p.z); controls.target.set(b.p.x, 2.6, b.p.z);
      if (walk.t >= 1) walk = null;
    }
    if (fly) {
      fly.t = Math.min(1, fly.t + 0.022);
      const e = fly.t < 0.5 ? 2 * fly.t * fly.t : 1 - Math.pow(-2 * fly.t + 2, 2) / 2;
      camera.position.lerpVectors(fly.fromP, fly.to.pos, e);
      controls.target.lerpVectors(fly.fromT, fly.to.target, e);
      if (fly.t >= 1) fly = null;
    }
    if (!reduceMotion) {
      for (let i = 0; i < pPos.count; i++) {
        const x = poolBase[i * 3], z = poolBase[i * 3 + 2], r = Math.hypot(x, z);
        pPos.array[i * 3 + 1] = 0.035 * Math.sin(r * 1.6 - t * 2.0) * Math.min(1, r / 2) + 0.015 * Math.sin(x * 2.1 + t * 1.3) * Math.sin(z * 1.7 - t);
      }
      pPos.needsUpdate = true; poolGeo.computeVertexNormals();
      updatePool(t, dt);
      if (streamWater) streamWater.material.map.offset.x = t * 0.01;
    }
    const fl = reduceMotion ? 0 : 1;
    flames.forEach((f) => {
      const k = 1 + fl * (0.18 * Math.sin(t * 9 + f.userData.phase) + 0.1 * Math.sin(t * 17 + f.userData.phase * 2));
      f.scale.set(1, k, 1); f.position.y = f.userData.base + (f.userData.h * k) / 2;
      f.material.opacity = 0.7 + fl * 0.2 * Math.sin(t * 11 + f.userData.phase);
    });
    glowMat.opacity = (dusk ? 0.6 : 0.22) * (1 + fl * 0.15 * Math.sin(t * 11));
    fireLight.intensity = (dusk ? 3.2 : 1.4) * (1 + fl * 0.12 * Math.sin(t * 13) + fl * 0.06 * Math.sin(t * 29));
    controls.update();
    renderer.render(scene, camera);
    placeLabels();
    requestAnimationFrame(tick);
  }
  document.getElementById('loading').hidden = true;
  applyLighting();
  tick();
})();
</script>
</body>
</html>
